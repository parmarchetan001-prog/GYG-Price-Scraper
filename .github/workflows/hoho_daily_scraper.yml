name: HOHO Daily Price Scraper

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "Europe/London"

  workflow_dispatch:

jobs:
  scrape:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - part: 1
            start: "2026-09-21"
            end: "2026-09-30"
          - part: 2
            start: "2026-10-01"
            end: "2026-10-10"
          - part: 3
            start: "2026-10-11"
            end: "2026-10-20"
          - part: 4
            start: "2026-10-21"
            end: "2026-10-31"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run HOHO scraper
        env:
          HOHO_START_DATE: ${{ matrix.start }}
          HOHO_END_DATE: ${{ matrix.end }}
        run: |
          python HOHO.py

      - name: Upload HOHO part
        uses: actions/upload-artifact@v4
        with:
          name: HOHO-Part-${{ matrix.part }}
          path: HOHO_competitor_Prices.xlsx
          retention-days: 30
  merge:
    needs: scrape
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download HOHO parts
        uses: actions/download-artifact@v5
        with:
          pattern: HOHO-Part-*
          path: hoho_parts

      - name: Merge HOHO Excel files
        run: |
          python - <<'PY'
          import glob
          import os
          import shutil
          from copy import copy
          from openpyxl import load_workbook

          files = sorted(
              glob.glob("hoho_parts/HOHO-Part-*/HOHO_competitor_Prices.xlsx")
          )

          if not files:
              raise FileNotFoundError("No HOHO Excel files found.")

          output = "HOHO_competitor_Prices.xlsx"

          shutil.copy2(files[0], output)

          master = load_workbook(output)

          for file in files[1:]:
              source = load_workbook(file)

              for sheet_name in source.sheetnames:
                  source_ws = source[sheet_name]

                  if sheet_name not in master.sheetnames:
                      master.create_sheet(sheet_name)

                  target_ws = master[sheet_name]

                  start_row = target_ws.max_row + 1

                  for row in source_ws.iter_rows(min_row=2):
                      for source_cell in row:
                          target_cell = target_ws.cell(
                              row=start_row + source_cell.row - 2,
                              column=source_cell.column
                          )

                          target_cell.value = source_cell.value

                          if source_cell.has_style:
                              target_cell._style = copy(source_cell._style)

                          if source_cell.number_format:
                              target_cell.number_format = source_cell.number_format

                          if source_cell.alignment:
                              target_cell.alignment = copy(source_cell.alignment)

                          if source_cell.protection:
                              target_cell.protection = copy(source_cell.protection)

                  for col_letter, dimension in source_ws.column_dimensions.items():
                      if col_letter not in target_ws.column_dimensions:
                          target_ws.column_dimensions[col_letter] = copy(dimension)

              source.close()

          master.save(output)
          master.close()

          print(f"Merged {len(files)} HOHO files into {output}")
          PY

      - name: Upload final HOHO report
        uses: actions/upload-artifact@v4
        with:
          name: HOHO-Price-Report
          path: HOHO_competitor_Prices.xlsx
          retention-days: 30




          
